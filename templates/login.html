<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.0/css/all.css">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
<!-- PWA meta -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#00834e">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-512.png') }}">

</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-visual">
      <img src="{{ url_for('static', filename='img/confe_2025.jpg') }}" alt="Conferencia ETERNO">
      <div class="login-caption">
        <h1>Conferencia ETERNO</h1>
        <p class="mb-0">Gestión ágil y segura de asistentes.</p>
      </div>
    </section>
    <section class="login-form">
      <div class="page-eyebrow mb-2">Panel de acceso</div>
      <h2>Bienvenido de nuevo</h2>
      <p class="subtitle">Ingresa tus credenciales para continuar.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-warning">
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input id="username" type="text" class="form-control" name="username" placeholder="Escribe tu usuario" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input id="password" type="password" class="form-control" name="password" placeholder="Escribe tu contraseña" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Entrar <i class="fas fa-arrow-right ms-2"></i></button>
      </form>
    </section>
  </main>

</body>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
      .then(reg => console.log("Service Worker registrado:", reg))
      .catch(err => console.warn("Error al registrar SW:", err));
  }
</script>

</html>
